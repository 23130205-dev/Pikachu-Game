<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu Game</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            width: 1050px;
            padding: 15px;
            background-color: #181818;
            border: 2px solid #555;
            overflow: hidden;
        }

        .top-container {
            height: 55px;
            margin-bottom: 10px;
            background-color: #111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .score {
            color: #ffeb3b;
        }

        .lives {
            color: #ef4444;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lives .heart-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            position: relative;
            transition: transform 0.3s ease, opacity 0.3s;
        }

        .lives .heart-icon::before,
        .lives .heart-icon::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 16px;
            background-color: #ef4444;
            border-radius: 10px 10px 0 0;
            top: 0;
        }

        .lives .heart-icon::before {
            left: 8px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .lives .heart-icon::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        .lives .heart-icon.lost {
            opacity: 0.2;
            transform: scale(0.8);
        }

        .lives .heart-icon.lost::before,
        .lives .heart-icon.lost::after {
            background-color: #888;
        }

        .level {
            border: 2px solid #ffffff;
            border-radius: 12px;
            padding: 6px 14px;
        }

        .time {
            color: #14b8a6;
        }

        .main-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .menu {
            width: 85px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu button {
            position: relative;
            width: 85px;
            height: 52px;
            border: 1px solid #39727a;
            border-radius: 12px;
            background: #164e63;
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .menu button .btn-icon {
            font-size: 14px;
            line-height: 1;
        }

        .menu button:hover {
            background: #0891b2;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.45);
        }

        .menu button:active {
            transform: scale(0.95);
        }

        .menu button.hint-button {
            background: #e3c084;
            color: #222;
            border-color: #f1b825;
        }

        .menu button.hint-button:hover {
            background: #fbbf24;
        }

        .hint-count,
        .shuffle-count,
        .ice-break-count {
            position: absolute;
            top: -7px;
            right: -7px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            border: 2px solid #181818;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .hint-count,
        .shuffle-count {
            background-color: #ef4444;
        }

        .shuffle-count.empty,
        .ice-break-count.empty {
            opacity: 0.5;
        }

        .ice-break-count {
            background-color: #0ea5e9;
        }

        .level-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .level-modal.show {
            display: flex;
        }

        .level-box {
            width: 400px;
            padding: 25px;
            background-color: #181818;
            border: 2px solid #555;
            border-radius: 15px;
            text-align: center;
            color: white;
        }

        .level-box h2 {
            margin: 0 0 25px;
            color: #ffeb3b;
        }

        .level-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .level-select-button {
            height: 50px;
            border: 1px solid #39727a;
            border-radius: 10px;
            background: #164e63;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .level-select-button:hover {
            background: #0891b2;
            transform: translateY(-2px);
        }

        .close-level-button {
            width: 120px;
            height: 40px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background-color: #555;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .close-level-button:hover {
            background-color: #777;
        }

        .board-box {
            position: relative;
            width: 900px;
            height: 520px;
            background-image: url("images/background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .time-bar {
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 8px;
            background-color: #333;
            border-radius: 4px;
            overflow: hidden;
            z-index: 10;
        }

        .time-progress {
            width: 100%;
            height: 100%;
            background-color: #22c55e;
            transition: width 1s linear, background-color 0.3s;
        }

        .time-progress.warning {
            background-color: #f59e0b;
        }

        .time-progress.danger {
            background-color: #ef4444;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(16, 54px);
            grid-template-rows: repeat(9, 54px);
            gap: 2px;
            position: relative;
            z-index: 2;
        }

        .cell {
            width: 54px;
            height: 54px;
            background-color: #f6a8ce;
            border: 1px solid #88054a;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .cell:hover {
            background-color: #ffe3f1;
        }

        .cell img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            pointer-events: none;
        }

        .cell.selected {
            background-color: #8cff8c;
            border: 3px solid #20a020;
        }

        .cell.hint {
            background-color: yellow;
            border: 3px solid red;
        }

        .cell.obstacle {
            background-color: #555;
            border: 2px solid #222;
            cursor: not-allowed;
        }

        .cell.obstacle::after {
            content: "✖";
            color: #222;
            font-size: 26px;
            font-weight: bold;
        }

        .cell.skill-cell {
            background-color: #f3e89e;
            border: 2px solid #f59e0b;
            font-size: 26px;
            color: #ba690a;
            font-weight: bold;
        }

        .cell.skill-teleport::after { content: "↔"; }
        .cell.skill-destroy::after  { content: "⚒"; }
        .cell.skill-double::after   { content: "★"; }
        .cell.skill-freeze::after   { content: "❄"; }

        .cell.skill-cell:hover {
            background-color: #f3e89e;
            transform: scale(1.05);
        }

        .cell.night-hidden {
            background: #111827 !important;
            opacity: 0.9;
        }

        .cell.night-hidden::after {
            content: "🌙";
            font-size: 18px;
            opacity: 0.5;
        }

        .cell.memory-hidden {
            background-color: #555;
            border-color: #333;
        }

        .cell.memory-hidden::after {
            content: "?";
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .cell.pair-correct {
            background-color: #8cff8c !important;
            border: 3px solid #20a020;
            box-shadow: 0 0 15px #8cff8c;
        }

        .cell.pair-wrong {
            background-color: #f44336 !important;
            border: 3px solid #b71c1c;
            box-shadow: 0 0 15px #f44336;
        }

        .cell.ice-cell {
            background: #bae6fd;
            border: 2px solid #0284c7;
            position: relative;
            overflow: hidden;
        }

        .cell.ice-cell::before {
            content: "❄";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            color: #ffffff;
            text-shadow: 0 0 6px rgba(2, 132, 199, 0.7);
            opacity: 0.9;
        }

        .cell.ice-cell.ice-thawing,
        .cell.ice-cell.thawing {
            animation: ice-thaw 0.8s ease-in-out infinite;
        }

        .cell.ice-cell.ice-thawing::before,
        .cell.ice-cell.thawing::before {
            content: "❄";
            opacity: 0.95;
            animation: ice-drip 1s ease-in-out infinite;
        }

        @keyframes ice-thaw {
            0%, 100% { background: #d4f3fc; }
            50%      { background: #b6e7fa; }
        }

        @keyframes ice-drip {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50%      { transform: translate(-50%, -45%) scale(1.15); }
        }

        .ice-status {
            padding: 6px 14px;
            background: rgb(6 152 227 / 0.9);
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            border-radius: 18px;
            border: 2px solid #e0f2fe;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .ice-status .ice-progress-bar {
            display: inline-block;
            width: 80px;
            height: 8px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 4px;
            vertical-align: middle;
            margin-left: 8px;
            overflow: hidden;
        }

        .ice-status .ice-progress-fill {
            display: block;
            height: 100%;
            width: 0%;
            background: #fde68a;
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .menu button.ice-break-button {
            background: #0369a1;
            border-color: #38bdf8;
        }

        .menu button.ice-break-button:hover {
            background: #0284c7;
        }

        .menu button.ice-break-button.ready {
            background: #f59e0b;
            border-color: #fbbf24;
            color: #082f49;
            animation: ice-ready-pulse 1.2s ease-in-out infinite;
        }

        @keyframes ice-ready-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35); }
            50%      { transform: scale(1.05); box-shadow: 0 0 16px rgba(251, 191, 36, 0.7); }
        }

        .path {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .path-line {
            fill: none;
            stroke: #00ff00;
            stroke-width: 4;
            stroke-linecap: square;
            stroke-linejoin: round;
        }

        .message {
            height: 35px;
            margin-top: 10px;
            color: white;
            text-align: center;
            font-size: 16px;
            line-height: 35px;
        }

        .game-container.paused .board {
            opacity: 0.25;
        }

        @media (max-width: 850px) {
            .game-container { transform: scale(0.8); }
        }

        @media (max-width: 650px) {
            .game-container { transform: scale(0.6); }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="top-container">
        <div class="score">Điểm: <span id="score">0</span></div>
        <div class="level-score">Điểm level: <span id="levelScore">0</span></div>
        <div class="lives" id="lives">Mạng:
            <span class="heart-icon"></span>
            <span class="heart-icon"></span>
            <span class="heart-icon"></span>
            <span class="heart-icon"></span>
            <span class="heart-icon"></span>
        </div>
        <div id="iceStatus" class="ice-status">
            <span id="iceStatusText">Băng giá: 0/2</span>
            <span class="ice-progress-bar">
                    <span class="ice-progress-fill" id="iceProgressFill"></span>
                </span>
        </div>
        <div class="level">Level: <span id="level">1</span>/6</div>
        <div class="time">Thời gian: <span id="time">300</span></div>
    </div>

    <div class="main-container">
        <div class="menu">
            <button id="newButton" class="game-button">
                <span class="btn-icon">↻</span><span>Chơi lại</span>
            </button>
            <button id="levelButton" class="game-button">
                <span class="btn-icon">☰</span><span>Chọn Level</span>
            </button>
            <button id="iceBreakButton" class="game-button ice-break-button">
                <span class="btn-icon">❄</span><span>Tan băng</span>
                <span class="ice-break-count" id="iceBreakCount">0</span>
            </button>
            <button id="hintButton" class="game-button hint-button">
                <span class="btn-icon">?</span><span>Gợi ý</span>
                <span class="hint-count">3</span>
            </button>
            <button id="shuffleButton" class="game-button">
                <span class="btn-icon">⇄</span><span>Đổi vị trí</span>
                <span class="shuffle-count">3</span>
            </button>
            <button id="pauseButton" class="game-button">
                <span class="btn-icon" id="pauseIcon">❚❚</span>
                <span id="pauseText">Tạm dừng</span>
            </button>
            <button id="soundButton" class="game-button">
                <span class="btn-icon" id="soundIcon">♪</span>
                <span id="soundText">Âm thanh</span>
            </button>
            <button id="exitButton" class="game-button">
                <span class="btn-icon">✕</span><span>Thoát</span>
            </button>
        </div>

        <div class="board-box">
            <div class="time-bar">
                <div id="timeProgress" class="time-progress"></div>
            </div>
            <div id="board" class="board"></div>
            <svg id="path" class="path"></svg>
        </div>
    </div>

    <div id="message" class="message"></div>
</div>

<audio id="correctSound" src="sounds/correct.mp3"></audio>
<audio id="wrongSound" src="sounds/incorrect.mp3"></audio>
<audio id="levelUpSound" src="sounds/level-up.mp3"></audio>
<audio id="shuffleSound" src="sounds/shuffle.mp3"></audio>

<div id="levelModal" class="level-modal">
    <div class="level-box">
        <h2>CHỌN LEVEL</h2>
        <div class="level-list">
            <button class="level-select-button" data-level="1">Level 1</button>
            <button class="level-select-button" data-level="2">Level 2</button>
            <button class="level-select-button" data-level="3">Level 3</button>
            <button class="level-select-button" data-level="4">Level 4</button>
            <button class="level-select-button" data-level="5">Level 5</button>
            <button class="level-select-button" data-level="6">Level 6</button>
        </div>
        <button id="closeLevelButton" class="close-level-button">Hủy</button>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
