<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
    <div class="top-container">
        <div class="score">Điểm: <span id="score">0</span></div>
        <div class="level-score">Điểm level hiện tại: <span id="levelScore">0</span></div>
        <div class="lives" id="lives">Mạng:
            <span class="heart-icon"></span>
            <span class="heart-icon"></span>
            <span class="heart-icon"></span>
            <span class="heart-icon"></span>
            <span class="heart-icon"></span>
        </div>
        <div class="level">Level: <span id="level">1</span>/6</div>
        <div class="time">Thời gian: <span id="time">80</span></div>
    </div>

    <div class="main-container">
        <div class="menu">
            <button id="newButton" class="game-button">
                <span class="btn-icon">↻</span><span>Chơi lại</span>
            </button>

            <button id="levelButton" class="game-button">
                <span class="btn-icon">☰</span><span>Chọn Level</span>
            </button>

            <button id="hintButton" class="game-button hint-button">
                <span class="btn-icon">?</span><span>Gợi ý</span><span class="hint-count">3</span>
            </button>

            <button id="shuffleButton" class="game-button">
                <span class="btn-icon">⇄</span><span>Đổi vị trí</span><span class="shuffle-count">3</span>
            </button>

            <button id="pauseButton" class="game-button">
                <span class="btn-icon" id="pauseIcon">❚❚</span><span id="pauseText">Tạm dừng</span>
            </button>

            <button id="soundButton" class="game-button">
                <span class="btn-icon" id="soundIcon">♪</span><span id="soundText">Âm thanh</span>
            </button>

            <button id="exitButton" class="game-button">
                <span class="btn-icon">✕</span><span>Thoát</span>
            </button>
        </div>

        <div class="board-box">
            <div class="time-bar">
                <div id="timeProgress" class="time-progress"></div>
            </div>
            <div id="board" class="board"></div>
            <svg id="path" class="path"></svg>
        </div>
    </div>

    <div id="message" class="message"></div>
</div>

<audio id="clickSound" src="sounds/click.mp3"></audio>
<audio id="correctSound" src="sounds/correct.mp3"></audio>
<audio id="wrongSound" src="sounds/incorrect.mp3"></audio>
<audio id="levelUpSound" src="sounds/level-up.mp3"></audio>
<audio id="shuffleSound" src="sounds/shuffle.mp3"></audio>

<div id="levelModal" class="level-modal">
    <div class="level-box">
        <h2>CHỌN LEVEL</h2>
        <div class="level-list">
            <button class="level-select-button" data-level="1">Level 1</button>
            <button class="level-select-button" data-level="2">Level 2</button>
            <button class="level-select-button" data-level="3">Level 3</button>
            <button class="level-select-button" data-level="4">Level 4</button>
            <button class="level-select-button" data-level="5">Level 5</button>
            <button class="level-select-button" data-level="6">Level 6</button>
        </div>
        <button id="closeLevelButton" class="close-level-button">Hủy</button>
    </div>
</div>

<script src="gamePikachu.js"></script>
</body>
</html>
